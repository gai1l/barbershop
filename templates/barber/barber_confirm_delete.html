{% extends 'base.html' %}

{% block title %}ลบข้อมูลช่าง | BarberShop{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">🗑️ ลบข้อมูลช่าง</h1>
</div>

<div class="card" style="max-width: 500px;">
    <p style="color:var(--text-primary); margin-bottom:1rem;">
        คุณต้องการลบข้อมูลช่าง <strong style="color:var(--accent);">{{ barber.name }}</strong> ใช่หรือไม่?
    </p>
    <p style="color:var(--danger); font-size:0.875rem; margin-bottom:1.5rem;">
        ⚠️ การลบจะไม่สามารถกู้คืนได้ และจะลบ User Login ของช่างด้วย
    </p>

    <form method="post">
        {% csrf_token %}
        <div style="display:flex; gap:8px;">
            <button type="submit" class="btn btn-danger">🗑️ ยืนยันลบ</button>
            <a href="{% url 'barber_list' %}" class="btn btn-outline">ยกเลิก</a>
        </div>
    </form>
</div>
{% endblock %}
